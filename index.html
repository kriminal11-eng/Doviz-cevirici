<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Döviz">
  <title>Döviz Hesap</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Döviz</h1>
    <div class="status">
      <span id="updated">Kurlar yükleniyor…</span>
      <button id="refresh" class="icon-btn" aria-label="Kurları yenile">⟳</button>
    </div>
  </header>

  <main>
    <!-- DÖVİZ -->
    <section id="tab-fx" class="tab active">
      <ul id="fx-list" class="fx-list"></ul>
      <button id="add-cur" class="add-btn">+ Para birimi ekle</button>
    </section>

    <!-- HESAP MAKİNESİ -->
    <section id="tab-calc" class="tab">
      <div class="calc-history" id="calc-history"></div>
      <div class="calc-display">
        <div id="calc-expr" class="calc-expr">0</div>
        <div id="calc-preview" class="calc-preview"></div>
      </div>
      <div class="calc-tools">
        <button id="calc-clear-hist" class="chip">Geçmişi sil</button>
        <button id="calc-to-fx" class="chip">Sonucu dövize aktar →</button>
      </div>
    </section>
  </main>

  <div id="keypad" class="keypad"></div>

  <nav class="tabbar">
    <button data-tab="fx" class="active"><span>💱</span>Döviz</button>
    <button data-tab="calc"><span>🧮</span>Hesap Makinesi</button>
  </nav>

  <!-- Para birimi seçici -->
  <div id="picker" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-inner">
      <div class="sheet-head">
        <input id="picker-search" type="search" placeholder="Ara: dolar, EUR, altın…" autocomplete="off">
        <button id="picker-close" class="icon-btn" aria-label="Kapat">✕</button>
      </div>
      <ul id="picker-list" class="picker-list"></ul>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
